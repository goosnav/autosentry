# CI: lint + type-check + unit tests for the hub package (right-arm L4 gate, M0 exit).
# The core (contracts, state machine, LoRa codec) installs and tests without the ML stack,
# so CI stays fast and hardware-free.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hub:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint (hub + scripts)
        run: ruff check . ../scripts
      - name: Mypy (typed core only)
        run: mypy
      - name: Pytest
        run: pytest -q
        env:
          AUTOSENTRY_MESH_KEY: ci-dummy-key
      - name: Golden wire vectors are in sync with the codec
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/gen_wire_vectors.py
          git diff --exit-code firmware/alarm_node/test/wire_vectors.json \
            || (echo "::error::wire_vectors.json is stale — run scripts/gen_wire_vectors.py" && exit 1)

  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [lilygo_t3s3, heltec_v3, hub_gateway]   # node boards + the USB-serial gateway role
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware (${{ matrix.env }})
        # A real mesh key so the node build links a non-placeholder key; the gateway ignores it.
        run: pio run -d firmware/alarm_node -e ${{ matrix.env }}
        env:
          PLATFORMIO_BUILD_FLAGS: '-DAUTOSENTRY_MESH_KEY=\"ci-build-key\"'
