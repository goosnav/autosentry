; AutoSentry alarm node — ESP32-S3 + SX1262 (LilyGO T3-S3 / Heltec WiFi LoRa 32 V3).
; Also builds as the hub's USB-serial LoRa gateway (same radio, gateway role via build flag).
; See docs/HARDWARE.md (BOM) and docs/COMMS_PROTOCOL.md (ICD-3, wire format).
;
; STATUS: node role — radio init + parse/verify + ACK(ref) + siren GPIO + heartbeat + mains
; fail-safe; gateway role — USB-serial<->LoRa COBS bridge (ICD-2). Provision the mesh key at
; flash time via -DAUTOSENTRY_MESH_KEY (see docs/PRODUCTION_PROVISIONING.md).

[platformio]
default_envs = lilygo_t3s3

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^6.6.0   ; SX1262 driver
build_flags =
    -DAUTOSENTRY_FW_VERSION=1
    ; Wire-protocol constants — MUST match hub/autosentry/comms/protocol.py byte-for-byte.
    -DPROTO_VERSION=0x01
    -DHMAC_LEN=8
    -DHEADER_LEN=9
    -DBROADCAST_ADDR=0xFF

; --- Alarm node (ESP32-S3 + SX1262, e.g. LilyGO T3-S3) ---
[env:lilygo_t3s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DAUTOSENTRY_ROLE_NODE=1
    ; SX1262 pin map for LilyGO T3-S3 (verify against your board revision).
    -DLORA_CS=7 -DLORA_DIO1=33 -DLORA_RST=8 -DLORA_BUSY=34
    -DLORA_SCK=5 -DLORA_MISO=3 -DLORA_MOSI=6
    -DPIN_SIREN=21 -DPIN_STROBE=14 -DPIN_MAINS_SENSE=2

; --- Heltec WiFi LoRa 32 V3 (alternative node board) ---
[env:heltec_v3]
platform = espressif32
board = heltec_wifi_lora_32_V3
build_flags =
    ${env.build_flags}
    -DAUTOSENTRY_ROLE_NODE=1
    -DLORA_CS=8 -DLORA_DIO1=14 -DLORA_RST=12 -DLORA_BUSY=13
    -DLORA_SCK=9 -DLORA_MISO=11 -DLORA_MOSI=10
    -DPIN_SIREN=21 -DPIN_STROBE=35 -DPIN_MAINS_SENSE=7

; --- Hub gateway role (same board, bridges USB-serial <-> LoRa) ---
[env:hub_gateway]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DAUTOSENTRY_ROLE_GATEWAY=1
    -DLORA_CS=7 -DLORA_DIO1=33 -DLORA_RST=8 -DLORA_BUSY=34
    -DLORA_SCK=5 -DLORA_MISO=3 -DLORA_MOSI=6

; --- Host-native unit tests (no hardware): `pio test -e native` ---
; Tests the pure protocol/framing logic against the golden vectors in test/wire_vectors.json
; (see test/README.md). test_build_src=no so the Arduino/RadioLib firmware isn't pulled into
; the host build — the test sources include the extracted pure logic directly.
[env:native]
platform = native
test_build_src = no
build_flags = ${env.build_flags}
